<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wydarzenia — Panel admina</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="admin-sidebar-slot"></div>
<div class="admin-main">
  <div id="admin-topbar-slot"></div>
  <div class="admin-content">

    <div class="admin-card">
      <div class="admin-card-head">
        <h3>Wydarzenia (<span id="count">0</span>)</h3>
        <button class="btn btn-primary" id="btnNew">+ Nowe wydarzenie</button>
      </div>
      <div class="admin-card-body" style="padding-bottom:0">
        <div class="page-filters">
          <input type="search" id="search" placeholder="Szukaj...">
          <select id="filter-time"><option value="all">Wszystkie</option><option value="upcoming" selected>Nadchodzące</option><option value="past">Przeszłe</option></select>
        </div>
      </div>
      <table class="admin-table">
        <thead><tr><th></th><th>Tytuł</th><th>Termin</th><th>Lokalizacja</th><th>Zapisy</th><th>Status</th><th></th></tr></thead>
        <tbody id="ev-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
if (Admin.init({ title: "Wydarzenia" })) {
  let state = { search: "", time: "upcoming" };

  function render() {
    let list = Store.all("events");
    const today = new Date().toISOString().slice(0,10);
    if (state.search) list = list.filter(e => e.title.toLowerCase().includes(state.search));
    if (state.time === "upcoming") list = list.filter(e => e.endDate >= today);
    if (state.time === "past") list = list.filter(e => e.endDate < today);
    list.sort((a,b) => state.time === "past" ? (b.startDate||"").localeCompare(a.startDate||"") : (a.startDate||"").localeCompare(b.startDate||""));

    document.getElementById("count").textContent = list.length;
    const tb = document.getElementById("ev-tbody");
    if (!list.length) { tb.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Brak wydarzeń</td></tr>`; return; }
    tb.innerHTML = list.map(e => {
      const pct = e.capacity ? Math.round((e.registered||0)/e.capacity*100) : 0;
      return `
      <tr>
        <td><div class="thumb" style="background:${e.cover}"></div></td>
        <td><strong>${App.escapeHtml(e.title)}</strong><br><small style="color:var(--text-muted)"><span class="badge">${App.escapeHtml(e.category)}</span> ${App.escapeHtml(e.price)}</small></td>
        <td>${App.fmtDateShort(e.startDate)}${e.endDate!==e.startDate?'<br>– '+App.fmtDateShort(e.endDate):''}<br><small style="color:var(--text-muted)">${App.escapeHtml(e.time||'')}</small></td>
        <td>${App.escapeHtml(e.location)}</td>
        <td>${e.capacity ? `<strong>${e.registered||0} / ${e.capacity}</strong> (${pct}%)<div style="width:100px;height:4px;background:var(--sand-100);border-radius:2px;margin-top:4px"><div style="width:${pct}%;height:100%;background:var(--sun-400);border-radius:2px"></div></div>` : '—'}</td>
        <td><span class="status-pill ${e.published?'published':'draft'}">${e.published?'Aktywne':'Szkic'}</span></td>
        <td><div class="row-actions">
          <button class="row-action-btn" data-edit="${e.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="row-action-btn delete" data-del="${e.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div></td>
      </tr>`;
    }).join("");
    tb.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openForm(b.dataset.edit)));
    tb.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (await Admin.confirmDialog("Usunąć wydarzenie?")) { Store.remove("events", b.dataset.del); App.toast("Usunięto","ok"); render(); }
    }));
  }

  function openForm(id) {
    const isNew = !id;
    const item = isNew ? { title:"", description:"", startDate:new Date().toISOString().slice(0,10), endDate:new Date().toISOString().slice(0,10), time:"", location:"", category:"Wydarzenia", capacity:100, registered:0, price:"30 zł", cover: Admin.GRADIENT_PRESETS[2], published:true } : Store.get("events", id);
    if (!item) return;

    const form = document.createElement("div");
    form.innerHTML = `
      <div class="form-group"><label>Tytuł *</label><input id="f-title" value="${App.escapeHtml(item.title)}" required></div>
      <div class="form-group"><label>Opis</label><textarea id="f-desc" rows="4">${App.escapeHtml(item.description)}</textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Data początkowa *</label><input type="date" id="f-start" value="${item.startDate}" required></div>
        <div class="form-group"><label>Data końcowa *</label><input type="date" id="f-end" value="${item.endDate}" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Godzina</label><input id="f-time" value="${App.escapeHtml(item.time||'')}" placeholder="np. 10:00 - 18:00"></div>
        <div class="form-group"><label>Kategoria</label><input id="f-cat" value="${App.escapeHtml(item.category)}"></div>
      </div>
      <div class="form-group"><label>Lokalizacja</label><input id="f-loc" value="${App.escapeHtml(item.location)}"></div>
      <div class="form-row">
        <div class="form-group"><label>Cena</label><input id="f-price" value="${App.escapeHtml(item.price)}" placeholder="np. 30 zł lub Bezpłatne"></div>
        <div class="form-group"><label>Limit miejsc</label><input type="number" id="f-cap" value="${item.capacity||0}" min="0"></div>
      </div>
      <div class="form-group"><label>Zapisanych obecnie</label><input type="number" id="f-reg" value="${item.registered||0}" min="0"></div>
      <div class="form-group"><label>Zdjęcie tytułowe</label><div id="f-cover-wrap"></div></div>
      <div class="form-group"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-pub" ${item.published?'checked':''} style="width:auto"> Aktywne (pokaż publicznie)</label></div>
    `;
    let cover = item.cover;
    form.querySelector("#f-cover-wrap").appendChild(Admin.gradientPicker(item.cover, v => cover = v));

    const m = Admin.modal({
      title: isNew ? "Nowe wydarzenie" : "Edytuj wydarzenie",
      body: form,
      footer: `<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="save">Zapisz</button>`
    });
    m.root.querySelector("#save").addEventListener("click", () => {
      const title = form.querySelector("#f-title").value.trim();
      if (!title) return App.toast("Tytuł wymagany","err");
      const data = {
        title,
        slug: Admin.slugify(title),
        description: form.querySelector("#f-desc").value,
        startDate: form.querySelector("#f-start").value,
        endDate: form.querySelector("#f-end").value,
        time: form.querySelector("#f-time").value,
        location: form.querySelector("#f-loc").value,
        category: form.querySelector("#f-cat").value || "Wydarzenia",
        price: form.querySelector("#f-price").value,
        capacity: parseInt(form.querySelector("#f-cap").value) || 0,
        registered: parseInt(form.querySelector("#f-reg").value) || 0,
        cover,
        published: form.querySelector("#f-pub").checked
      };
      if (isNew) Store.add("events", data); else Store.update("events", id, data);
      App.toast(isNew?"Dodano!":"Zapisano!","ok");
      m.close(); render();
    });
  }

  document.getElementById("btnNew").addEventListener("click", () => openForm(null));
  document.getElementById("search").addEventListener("input", e => { state.search = e.target.value.toLowerCase(); render(); });
  document.getElementById("filter-time").addEventListener("change", e => { state.time = e.target.value; render(); });
  const editId = new URLSearchParams(location.search).get("edit");
  render();
  if (editId) openForm(editId);
}
</script>
</body>
</html>

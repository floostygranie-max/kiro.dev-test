<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aktualności — Panel admina</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="admin-sidebar-slot"></div>
<div class="admin-main">
  <div id="admin-topbar-slot"></div>
  <div class="admin-content">

    <div class="admin-card">
      <div class="admin-card-head">
        <h3>Aktualności (<span id="count">0</span>)</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" id="btnNew">+ Nowa aktualność</button>
        </div>
      </div>
      <div class="admin-card-body" style="padding-bottom: 0">
        <div class="page-filters">
          <input type="search" id="search" placeholder="Szukaj...">
          <select id="filter-cat"><option value="">Wszystkie kategorie</option></select>
          <select id="filter-status"><option value="">Wszystkie statusy</option><option value="published">Opublikowane</option><option value="draft">Szkice</option></select>
        </div>
      </div>
      <table class="admin-table">
        <thead>
          <tr>
            <th></th><th>Tytuł</th><th>Kategoria</th><th>Data</th><th>Wyśw.</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="news-tbody"></tbody>
      </table>
    </div>

  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
if (Admin.init({ title: "Aktualności" })) {
  let state = { search: "", cat: "", status: "" };

  function categories() { return [...new Set(Store.all("news").map(n => n.category))]; }

  function render() {
    const cats = categories();
    const sel = document.getElementById("filter-cat");
    if (sel.options.length === 1) cats.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); });

    let list = Store.all("news");
    if (state.search) list = list.filter(n => n.title.toLowerCase().includes(state.search) || (n.excerpt||"").toLowerCase().includes(state.search));
    if (state.cat) list = list.filter(n => n.category === state.cat);
    if (state.status === "published") list = list.filter(n => n.published);
    if (state.status === "draft") list = list.filter(n => !n.published);
    list.sort((a,b) => (b.date||"").localeCompare(a.date||""));

    document.getElementById("count").textContent = list.length;
    const tbody = document.getElementById("news-tbody");
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Brak aktualności</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(n => `
      <tr>
        <td><div class="thumb" style="background:${n.cover}"></div></td>
        <td>
          <strong>${App.escapeHtml(n.title)}</strong>
          ${n.featured ? '<span class="badge badge-accent" style="margin-left:6px">⭐ Wyróżnione</span>' : ''}
          <br><small style="color:var(--text-muted)">${App.escapeHtml((n.excerpt||"").slice(0,80))}...</small>
        </td>
        <td><span class="badge">${App.escapeHtml(n.category)}</span></td>
        <td>${App.fmtDateShort(n.date)}<br><small style="color:var(--text-muted)">${App.escapeHtml(n.author||"")}</small></td>
        <td><strong>${(n.views||0).toLocaleString('pl-PL')}</strong></td>
        <td><span class="status-pill ${n.published?'published':'draft'}">${n.published?'Opublikowane':'Szkic'}</span></td>
        <td>
          <div class="row-actions">
            <a class="row-action-btn" href="../news.html?id=${n.id}" target="_blank" title="Podgląd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></a>
            <button class="row-action-btn" data-edit="${n.id}" title="Edytuj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="row-action-btn delete" data-del="${n.id}" title="Usuń"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
        </td>
      </tr>
    `).join("");

    tbody.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openForm(b.dataset.edit)));
    tbody.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (await Admin.confirmDialog("Czy na pewno chcesz usunąć tę aktualność?")) {
        Store.remove("news", b.dataset.del);
        App.toast("Usunięto", "ok");
        render();
      }
    }));
  }

  function openForm(id) {
    const isNew = !id;
    const item = isNew ? { title: "", excerpt: "", content: "", category: "Aktualności", tags: [], cover: Admin.GRADIENT_PRESETS[0], date: new Date().toISOString().slice(0,10), author: Store.session().name, published: true, featured: false, views: 0 } : Store.get("news", id);
    if (!item) return;

    const form = document.createElement("div");
    form.innerHTML = `
      <div class="form-group"><label>Tytuł *</label><input id="f-title" value="${App.escapeHtml(item.title)}" required></div>
      <div class="form-row">
        <div class="form-group"><label>Kategoria</label><input id="f-cat" value="${App.escapeHtml(item.category)}" list="cat-list" required>
          <datalist id="cat-list">${[...new Set(Store.all("news").map(n => n.category))].map(c => `<option>${c}</option>`).join("")}</datalist>
        </div>
        <div class="form-group"><label>Data publikacji</label><input type="date" id="f-date" value="${item.date}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Autor</label><input id="f-author" value="${App.escapeHtml(item.author||'')}"></div>
        <div class="form-group"><label>Tagi (oddzielone przecinkiem)</label><input id="f-tags" value="${(item.tags||[]).join(', ')}"></div>
      </div>
      <div class="form-group"><label>Krótki opis (excerpt)</label><textarea id="f-excerpt" rows="2">${App.escapeHtml(item.excerpt)}</textarea></div>
      <div class="form-group"><label>Zdjęcie tytułowe (gradient)</label><div id="f-cover-wrap"></div></div>
      <div class="form-group"><label>Treść</label><div id="f-content"></div></div>
      <div class="form-row">
        <div class="form-group"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-published" ${item.published?'checked':''} style="width:auto"> Opublikowane</label></div>
        <div class="form-group"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-featured" ${item.featured?'checked':''} style="width:auto"> ⭐ Wyróżnione (pokaż na stronie głównej)</label></div>
      </div>
    `;
    let coverValue = item.cover;
    form.querySelector("#f-cover-wrap").appendChild(Admin.gradientPicker(item.cover, v => coverValue = v));

    const editor = Admin.richEditor(item.content || "");
    form.querySelector("#f-content").appendChild(editor);

    const m = Admin.modal({
      title: isNew ? "Nowa aktualność" : "Edytuj aktualność",
      body: form,
      footer: `<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="save">Zapisz</button>`
    });

    m.root.querySelector("#save").addEventListener("click", () => {
      const title = form.querySelector("#f-title").value.trim();
      if (!title) { App.toast("Tytuł jest wymagany", "err"); return; }
      const data = {
        title,
        slug: Admin.slugify(title),
        category: form.querySelector("#f-cat").value.trim() || "Aktualności",
        date: form.querySelector("#f-date").value,
        author: form.querySelector("#f-author").value.trim(),
        tags: form.querySelector("#f-tags").value.split(",").map(t => t.trim()).filter(Boolean),
        excerpt: form.querySelector("#f-excerpt").value.trim(),
        cover: coverValue,
        content: editor.getValue(),
        published: form.querySelector("#f-published").checked,
        featured: form.querySelector("#f-featured").checked
      };
      if (isNew) Store.add("news", { ...data, views: 0 });
      else Store.update("news", id, data);
      App.toast(isNew ? "Dodano!" : "Zapisano!", "ok");
      m.close();
      render();
    });
  }

  document.getElementById("btnNew").addEventListener("click", () => openForm(null));
  document.getElementById("search").addEventListener("input", e => { state.search = e.target.value.toLowerCase(); render(); });
  document.getElementById("filter-cat").addEventListener("change", e => { state.cat = e.target.value; render(); });
  document.getElementById("filter-status").addEventListener("change", e => { state.status = e.target.value; render(); });

  // Auto-open if ?edit=
  const editId = new URLSearchParams(location.search).get("edit");
  render();
  if (editId) openForm(editId);
}
</script>
</body>
</html>

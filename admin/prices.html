<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cennik — Panel admina</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="admin-sidebar-slot"></div>
<div class="admin-main">
  <div id="admin-topbar-slot"></div>
  <div class="admin-content">
    <div class="admin-card">
      <div class="admin-card-head">
        <h3>Cennik (<span id="count">0</span>)</h3>
        <button class="btn btn-primary" id="btnNew">+ Nowa pozycja</button>
      </div>
      <div class="admin-card-body" style="padding-bottom:0">
        <div class="page-filters">
          <input type="search" id="search" placeholder="Szukaj...">
          <select id="filter-cat"><option value="">Wszystkie kategorie</option></select>
        </div>
      </div>
      <table class="admin-table">
        <thead><tr><th>Kategoria</th><th>Nazwa</th><th>Cena</th><th>Jednostka</th><th>Opis</th><th>Kolejność</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
if (Admin.init({ title: "Cennik" })) {
  let state = { search: "", cat: "" };

  function render() {
    let list = Store.all("prices");
    if (state.search) list = list.filter(p => p.name.toLowerCase().includes(state.search));
    if (state.cat) list = list.filter(p => p.category === state.cat);
    list.sort((a,b) => (a.category||"").localeCompare(b.category||"") || (a.order||0)-(b.order||0));

    const cats = [...new Set(Store.all("prices").map(p => p.category))];
    const sel = document.getElementById("filter-cat");
    if (sel.options.length === 1) cats.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); });

    document.getElementById("count").textContent = list.length;
    const tb = document.getElementById("tbody");
    if (!list.length) { tb.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Brak pozycji</td></tr>`; return; }
    tb.innerHTML = list.map(p => `
      <tr>
        <td><span class="badge">${App.escapeHtml(p.category)}</span></td>
        <td><strong>${App.escapeHtml(p.name)}</strong></td>
        <td><strong>${p.price === 0 ? 'Gratis' : p.price + ' zł'}</strong></td>
        <td>${App.escapeHtml(p.unit)}</td>
        <td><small>${App.escapeHtml(p.description||"")}</small></td>
        <td>${p.order||0}</td>
        <td><div class="row-actions">
          <button class="row-action-btn" data-edit="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="row-action-btn delete" data-del="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div></td>
      </tr>
    `).join("");
    tb.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openForm(b.dataset.edit)));
    tb.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (await Admin.confirmDialog("Usunąć pozycję?")) { Store.remove("prices", b.dataset.del); App.toast("Usunięto","ok"); render(); }
    }));
  }

  function openForm(id) {
    const isNew = !id;
    const item = isNew ? { category:"Bilety wstępu", name:"", price:0, unit:"os.", description:"", order: Store.all("prices").length+1 } : Store.get("prices", id);
    if (!item) return;
    const cats = [...new Set(Store.all("prices").map(p => p.category))];

    const form = document.createElement("div");
    form.innerHTML = `
      <div class="form-row">
        <div class="form-group"><label>Kategoria *</label><input id="f-cat" value="${App.escapeHtml(item.category)}" list="catlist" required>
          <datalist id="catlist">${cats.map(c => `<option>${c}</option>`).join("")}</datalist>
        </div>
        <div class="form-group"><label>Kolejność</label><input type="number" id="f-order" value="${item.order||0}"></div>
      </div>
      <div class="form-group"><label>Nazwa *</label><input id="f-name" value="${App.escapeHtml(item.name)}" required></div>
      <div class="form-row">
        <div class="form-group"><label>Cena (zł)</label><input type="number" id="f-price" value="${item.price}" min="0" step="0.01"></div>
        <div class="form-group"><label>Jednostka</label><input id="f-unit" value="${App.escapeHtml(item.unit)}" placeholder="np. os., grupa, godz."></div>
      </div>
      <div class="form-group"><label>Opis</label><textarea id="f-desc" rows="2">${App.escapeHtml(item.description||"")}</textarea></div>
    `;
    const m = Admin.modal({
      title: isNew ? "Nowa pozycja cennika" : "Edytuj pozycję cennika",
      body: form,
      footer: `<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="save">Zapisz</button>`
    });
    m.root.querySelector("#save").addEventListener("click", () => {
      const data = {
        category: form.querySelector("#f-cat").value.trim() || "Inne",
        name: form.querySelector("#f-name").value.trim(),
        price: parseFloat(form.querySelector("#f-price").value) || 0,
        unit: form.querySelector("#f-unit").value.trim() || "os.",
        description: form.querySelector("#f-desc").value,
        order: parseInt(form.querySelector("#f-order").value) || 0
      };
      if (!data.name) return App.toast("Nazwa wymagana","err");
      if (isNew) Store.add("prices", data); else Store.update("prices", id, data);
      App.toast(isNew?"Dodano!":"Zapisano!","ok"); m.close(); render();
    });
  }

  document.getElementById("btnNew").addEventListener("click", () => openForm(null));
  document.getElementById("search").addEventListener("input", e => { state.search = e.target.value.toLowerCase(); render(); });
  document.getElementById("filter-cat").addEventListener("change", e => { state.cat = e.target.value; render(); });
  render();
}
</script>
</body>
</html>

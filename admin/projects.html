<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Projekty — Panel admina</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="admin-sidebar-slot"></div>
<div class="admin-main">
  <div id="admin-topbar-slot"></div>
  <div class="admin-content">
    <div class="admin-card">
      <div class="admin-card-head">
        <h3>Projekty (<span id="count">0</span>)</h3>
        <button class="btn btn-primary" id="btnNew">+ Nowy projekt</button>
      </div>
      <table class="admin-table">
        <thead><tr><th></th><th>Tytuł</th><th>Status</th><th>Postęp</th><th>Budżet</th><th>Termin</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
if (Admin.init({ title: "Projekty" })) {
  const labels = { completed: "✅ Zakończone", "in-progress": "🔧 W trakcie", planned: "📋 Planowane" };

  function render() {
    const list = Store.all("projects");
    document.getElementById("count").textContent = list.length;
    const tb = document.getElementById("tbody");
    if (!list.length) { tb.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Brak projektów</td></tr>`; return; }
    tb.innerHTML = list.map(p => `
      <tr>
        <td><div class="thumb" style="background:${p.cover}"></div></td>
        <td><strong>${App.escapeHtml(p.title)}</strong><br><small style="color:var(--text-muted)">${App.escapeHtml((p.description||"").slice(0,80))}...</small></td>
        <td>${labels[p.status] || p.status}</td>
        <td><div style="width:120px"><div style="display:flex;justify-content:space-between;font-size:.75rem"><span>${p.progress}%</span></div><div style="height:6px;background:var(--sand-100);border-radius:3px;overflow:hidden"><div style="width:${p.progress}%;height:100%;background:${p.progress===100?'var(--ok)':'var(--sun-400)'}"></div></div></div></td>
        <td>${App.escapeHtml(p.budget)}<br><small style="color:var(--text-muted)">${App.escapeHtml(p.funding)}</small></td>
        <td><small>${App.fmtDateShort(p.startDate)} – ${App.fmtDateShort(p.endDate)}</small></td>
        <td><div class="row-actions">
          <button class="row-action-btn" data-edit="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="row-action-btn delete" data-del="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div></td>
      </tr>
    `).join("");
    tb.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openForm(b.dataset.edit)));
    tb.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (await Admin.confirmDialog("Usunąć projekt?")) { Store.remove("projects", b.dataset.del); App.toast("Usunięto","ok"); render(); }
    }));
  }

  function openForm(id) {
    const isNew = !id;
    const item = isNew ? { title:"", description:"", status:"planned", progress:0, budget:"", funding:"", startDate: new Date().toISOString().slice(0,10), endDate:"", cover: Admin.GRADIENT_PRESETS[0] } : Store.get("projects", id);
    if (!item) return;

    const form = document.createElement("div");
    form.innerHTML = `
      <div class="form-group"><label>Tytuł *</label><input id="f-title" value="${App.escapeHtml(item.title)}" required></div>
      <div class="form-group"><label>Opis</label><textarea id="f-desc" rows="3">${App.escapeHtml(item.description)}</textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Status</label><select id="f-status">
          <option value="planned" ${item.status==='planned'?'selected':''}>Planowany</option>
          <option value="in-progress" ${item.status==='in-progress'?'selected':''}>W trakcie</option>
          <option value="completed" ${item.status==='completed'?'selected':''}>Zakończony</option>
        </select></div>
        <div class="form-group"><label>Postęp (%)</label><input type="number" id="f-prog" value="${item.progress}" min="0" max="100"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Budżet</label><input id="f-budget" value="${App.escapeHtml(item.budget)}" placeholder="np. 1 200 000 zł"></div>
        <div class="form-group"><label>Finansowanie</label><input id="f-funding" value="${App.escapeHtml(item.funding)}" placeholder="np. EFRR UE"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Data rozpoczęcia</label><input type="date" id="f-start" value="${item.startDate}"></div>
        <div class="form-group"><label>Data zakończenia</label><input type="date" id="f-end" value="${item.endDate}"></div>
      </div>
      <div class="form-group"><label>Zdjęcie</label><div id="f-cover-wrap"></div></div>
    `;
    let cover = item.cover;
    form.querySelector("#f-cover-wrap").appendChild(Admin.gradientPicker(item.cover, v => cover = v));

    const m = Admin.modal({
      title: isNew ? "Nowy projekt" : "Edytuj projekt",
      body: form,
      footer: `<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="save">Zapisz</button>`
    });
    m.root.querySelector("#save").addEventListener("click", () => {
      const title = form.querySelector("#f-title").value.trim();
      if (!title) return App.toast("Tytuł wymagany","err");
      const data = {
        title,
        description: form.querySelector("#f-desc").value,
        status: form.querySelector("#f-status").value,
        progress: parseInt(form.querySelector("#f-prog").value) || 0,
        budget: form.querySelector("#f-budget").value,
        funding: form.querySelector("#f-funding").value,
        startDate: form.querySelector("#f-start").value,
        endDate: form.querySelector("#f-end").value,
        cover, gallery: item.gallery || []
      };
      if (isNew) Store.add("projects", data); else Store.update("projects", id, data);
      App.toast(isNew?"Dodano!":"Zapisano!","ok"); m.close(); render();
    });
  }

  document.getElementById("btnNew").addEventListener("click", () => openForm(null));
  render();
}
</script>
</body>
</html>

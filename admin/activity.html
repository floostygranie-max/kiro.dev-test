<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Logi aktywności — Panel admina</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="admin-sidebar-slot"></div>
<div class="admin-main">
  <div id="admin-topbar-slot"></div>
  <div class="admin-content">

    <div class="admin-card">
      <div class="admin-card-head">
        <h3>📋 Historia działań w panelu</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" id="btnExport">📥 Eksport CSV</button>
          <button class="btn btn-danger btn-sm" id="btnClear">🗑 Wyczyść logi</button>
        </div>
      </div>
      <div class="admin-card-body" style="padding-bottom:0">
        <div class="page-filters">
          <input type="search" id="search" placeholder="Szukaj akcji...">
          <select id="f-action">
            <option value="">Wszystkie akcje</option>
            <option value="create">Utworzono</option>
            <option value="update">Zaktualizowano</option>
            <option value="delete">Usunięto</option>
            <option value="login">Zalogowanie</option>
            <option value="publish">Publikacja</option>
          </select>
          <select id="f-target">
            <option value="">Wszystkie sekcje</option>
          </select>
        </div>
      </div>
      <div class="admin-card-body">
        <div class="activity-log-list" id="log-list"></div>
      </div>
    </div>

    <div class="alert alert-info" style="margin-top: 24px">
      <strong>ℹ️ O logach</strong><br>
      System rejestruje 500 ostatnich akcji w panelu administracyjnym. Logi są przechowywane lokalnie w przeglądarce.
      W produkcji powinny być wysyłane na serwer i zachowywane długoterminowo.
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
if (Admin.init({ title: "Logi aktywności" })) {
  let state = { search: "", action: "", target: "" };

  const actionLabels = {
    "create": { label: "Utworzono",      icon: "+", cls: "create" },
    "update": { label: "Zaktualizowano", icon: "✎", cls: "update" },
    "delete": { label: "Usunięto",       icon: "✕", cls: "delete" },
    "login":  { label: "Zalogowanie",    icon: "→", cls: "login" },
    "logout": { label: "Wylogowanie",    icon: "←", cls: "login" },
    "publish":{ label: "Publikacja",     icon: "✓", cls: "publish" }
  };
  const targetLabels = {
    "news": "Aktualności", "events": "Wydarzenia", "projects": "Projekty",
    "photos": "Zdjęcia", "galleryFolders": "Albumy", "prices": "Cennik",
    "poi": "POI", "trails": "Szlaki", "bikeTrails": "Trasy rowerowe",
    "users": "Użytkownicy", "settings": "Ustawienia",
    "partners": "Partnerzy", "faq": "FAQ", "departments": "Działy",
    "messages": "Wiadomości", "subscribers": "Subskrybenci",
    "system": "System", "auth": "Logowanie"
  };

  // Auto-create some seed activity if empty
  if (Admin.getActivities().length === 0) {
    const session = Store.session();
    Admin.logActivity("login", "auth", "Zalogowanie do panelu");
    Admin.logActivity("update", "settings", "Aktualizacja danych kontaktowych");
    Admin.logActivity("create", "news", "Nowy szlak edukacyjny już otwarty!");
    Admin.logActivity("publish", "news", "Wiosenne kwitnienie szczotlichy siwej");
    Admin.logActivity("create", "events", "Maraton Pustynny — bieg uliczny 21 km");
    Admin.logActivity("update", "prices", "Aktualizacja cennika parkingowego");
    Admin.logActivity("delete", "messages", "Usunięto przeczytaną wiadomość");
    Admin.logActivity("create", "partners", "Dodano nowego partnera medialnego");
  }

  function fmtRelative(iso) {
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return "przed chwilą";
    if (diff < 3600) return Math.floor(diff/60) + " min temu";
    if (diff < 86400) return Math.floor(diff/3600) + " godz temu";
    if (diff < 604800) return Math.floor(diff/86400) + " dni temu";
    return d.toLocaleDateString("pl-PL");
  }

  function render() {
    const all = Admin.getActivities();

    // Build target filter options
    const targets = [...new Set(all.map(a => a.target))];
    const sel = document.getElementById("f-target");
    if (sel.options.length === 1) targets.forEach(t => {
      const o = document.createElement("option");
      o.value = t; o.textContent = targetLabels[t] || t;
      sel.appendChild(o);
    });

    let list = all;
    if (state.search) list = list.filter(a => (a.details||"").toLowerCase().includes(state.search) || (a.target||"").toLowerCase().includes(state.search));
    if (state.action) list = list.filter(a => a.action === state.action);
    if (state.target) list = list.filter(a => a.target === state.target);

    const root = document.getElementById("log-list");
    if (!list.length) {
      root.innerHTML = `<div class="empty-state"><h3>Brak logów</h3><p>Po zmianach w panelu pojawią się tu zapisy.</p></div>`;
      return;
    }
    root.innerHTML = list.map(a => {
      const lbl = actionLabels[a.action] || { label: a.action, icon: "•", cls: "" };
      return `
        <div class="activity-log-item">
          <div class="act-icon ${lbl.cls}" title="${lbl.label}">${lbl.icon}</div>
          <div>
            <strong>${App.escapeHtml(lbl.label)} → ${App.escapeHtml(targetLabels[a.target] || a.target)}</strong><br>
            <small>${App.escapeHtml(a.details || "")} · użytkownik: <strong>${App.escapeHtml(a.userName || a.username)}</strong></small>
          </div>
          <div class="when" title="${App.fmtDate(a.date)}">${fmtRelative(a.date)}</div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("search").addEventListener("input", e => { state.search = e.target.value.toLowerCase(); render(); });
  document.getElementById("f-action").addEventListener("change", e => { state.action = e.target.value; render(); });
  document.getElementById("f-target").addEventListener("change", e => { state.target = e.target.value; render(); });
  document.getElementById("btnExport").addEventListener("click", () => {
    const all = Admin.getActivities();
    const csv = "Data,Akcja,Sekcja,Szczegóły,Użytkownik\n" +
      all.map(a => `"${a.date}","${a.action}","${a.target}","${(a.details||"").replace(/"/g,'""')}","${a.userName||a.username}"`).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "activity-log.csv";
    link.click();
    App.toast("Wyeksportowano CSV", "ok");
  });
  document.getElementById("btnClear").addEventListener("click", async () => {
    if (await Admin.confirmDialog("Na pewno usunąć wszystkie logi?")) {
      Admin.clearActivities();
      App.toast("Logi wyczyszczone", "ok");
      render();
    }
  });

  render();
}
</script>
</body>
</html>

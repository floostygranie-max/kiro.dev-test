<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mapa / POI — Panel admina</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="admin-sidebar-slot"></div>
<div class="admin-main">
  <div id="admin-topbar-slot"></div>
  <div class="admin-content">

    <div class="events-tabs" id="tabs" style="margin-bottom: 24px">
      <button class="active" data-tab="poi">📍 Punkty (POI)</button>
      <button data-tab="trails">🚶 Szlaki</button>
    </div>

    <div id="tab-poi">
      <div class="admin-card">
        <div class="admin-card-head">
          <h3>Punkty na mapie (<span id="poi-count">0</span>)</h3>
          <button class="btn btn-primary" id="btnNewPoi">+ Nowy punkt</button>
        </div>
        <table class="admin-table">
          <thead><tr><th>Nazwa</th><th>Typ</th><th>Pozycja</th><th>Opis</th><th></th></tr></thead>
          <tbody id="poi-tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-trails" style="display:none">
      <div class="admin-card">
        <div class="admin-card-head">
          <h3>Szlaki (<span id="t-count">0</span>)</h3>
          <button class="btn btn-primary" id="btnNewTrail">+ Nowy szlak</button>
        </div>
        <table class="admin-table">
          <thead><tr><th></th><th>Nazwa</th><th>Długość</th><th>Czas</th><th>Trudność</th><th></th></tr></thead>
          <tbody id="t-tbody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
if (Admin.init({ title: "Mapa / POI" })) {
  document.getElementById("tabs").addEventListener("click", e => {
    if (!e.target.dataset.tab) return;
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b === e.target));
    document.getElementById("tab-poi").style.display = e.target.dataset.tab === "poi" ? "" : "none";
    document.getElementById("tab-trails").style.display = e.target.dataset.tab === "trails" ? "" : "none";
  });

  const types = ["viewpoint","parking","info","family","rental","horse","camping","quad","wc","photo"];
  const typeLabels = { viewpoint:"Punkt widokowy", parking:"Parking", info:"Informacja", family:"Strefa rodzinna", rental:"Wypożyczalnia", horse:"Stajnia", camping:"Camping", quad:"Quady", wc:"Toaleta", photo:"Strefa foto" };

  function renderPoi() {
    const list = Store.all("poi");
    document.getElementById("poi-count").textContent = list.length;
    const tb = document.getElementById("poi-tbody");
    if (!list.length) { tb.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted)">Brak punktów</td></tr>`; return; }
    tb.innerHTML = list.map(p => `
      <tr>
        <td><strong>${App.escapeHtml(p.name)}</strong></td>
        <td><span class="badge">${typeLabels[p.type] || p.type}</span></td>
        <td><small>x: ${p.x}, y: ${p.y}</small></td>
        <td><small>${App.escapeHtml(p.description||"")}</small></td>
        <td><div class="row-actions">
          <button class="row-action-btn" data-edit="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="row-action-btn delete" data-del="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div></td>
      </tr>
    `).join("");
    tb.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openPoi(b.dataset.edit)));
    tb.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (await Admin.confirmDialog("Usunąć punkt?")) { Store.remove("poi", b.dataset.del); App.toast("Usunięto","ok"); renderPoi(); }
    }));
  }

  function openPoi(id) {
    const isNew = !id;
    const item = isNew ? { name:"", type:"viewpoint", x:50, y:50, description:"" } : Store.get("poi", id);
    if (!item) return;
    const form = document.createElement("div");
    form.innerHTML = `
      <div class="form-group"><label>Nazwa *</label><input id="f-name" value="${App.escapeHtml(item.name)}" required></div>
      <div class="form-row">
        <div class="form-group"><label>Typ</label><select id="f-type">${types.map(t => `<option value="${t}" ${t===item.type?'selected':''}>${typeLabels[t]}</option>`).join("")}</select></div>
        <div class="form-group">
          <label>Pozycja na mapie (0–100)</label>
          <div style="display:flex;gap:8px">
            <input type="number" id="f-x" value="${item.x}" min="0" max="100" placeholder="X">
            <input type="number" id="f-y" value="${item.y}" min="0" max="100" placeholder="Y">
          </div>
        </div>
      </div>
      <div class="form-group"><label>Opis</label><textarea id="f-desc" rows="2">${App.escapeHtml(item.description||"")}</textarea></div>
      <div class="alert alert-info" style="font-size:.85rem">💡 Współrzędne X/Y to procenty na mapie SVG (0=lewo/góra, 100=prawo/dół).</div>
    `;
    const m = Admin.modal({
      title: isNew ? "Nowy punkt na mapie" : "Edytuj punkt",
      body: form,
      footer: `<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="save">Zapisz</button>`
    });
    m.root.querySelector("#save").addEventListener("click", () => {
      const data = {
        name: form.querySelector("#f-name").value.trim(),
        type: form.querySelector("#f-type").value,
        x: parseFloat(form.querySelector("#f-x").value) || 0,
        y: parseFloat(form.querySelector("#f-y").value) || 0,
        description: form.querySelector("#f-desc").value
      };
      if (!data.name) return App.toast("Nazwa wymagana","err");
      if (isNew) Store.add("poi", data); else Store.update("poi", id, data);
      App.toast(isNew?"Dodano!":"Zapisano!","ok"); m.close(); renderPoi();
    });
  }

  function renderTrails() {
    const list = Store.all("trails");
    document.getElementById("t-count").textContent = list.length;
    const tb = document.getElementById("t-tbody");
    if (!list.length) { tb.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted)">Brak szlaków</td></tr>`; return; }
    tb.innerHTML = list.map(t => `
      <tr>
        <td><div style="width:36px;height:24px;background:${t.color};border-radius:6px"></div></td>
        <td><strong>${App.escapeHtml(t.name)}</strong></td>
        <td>${App.escapeHtml(t.length)}</td>
        <td>${App.escapeHtml(t.time)}</td>
        <td>${App.escapeHtml(t.difficulty)}</td>
        <td><div class="row-actions">
          <button class="row-action-btn" data-edit-t="${t.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="row-action-btn delete" data-del-t="${t.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div></td>
      </tr>
    `).join("");
    tb.querySelectorAll("[data-edit-t]").forEach(b => b.addEventListener("click", () => openTrail(b.dataset.editT)));
    tb.querySelectorAll("[data-del-t]").forEach(b => b.addEventListener("click", async () => {
      if (await Admin.confirmDialog("Usunąć szlak?")) { Store.remove("trails", b.dataset.delT); App.toast("Usunięto","ok"); renderTrails(); }
    }));
  }

  function openTrail(id) {
    const isNew = !id;
    const item = isNew ? { name:"", color:"#6E9A5C", length:"", difficulty:"łatwy", time:"", points:"50,50 60,60" } : Store.get("trails", id);
    if (!item) return;
    const form = document.createElement("div");
    form.innerHTML = `
      <div class="form-group"><label>Nazwa *</label><input id="f-name" value="${App.escapeHtml(item.name)}" required></div>
      <div class="form-row">
        <div class="form-group"><label>Kolor</label><input type="color" id="f-color" value="${item.color}"></div>
        <div class="form-group"><label>Długość</label><input id="f-length" value="${App.escapeHtml(item.length)}" placeholder="np. 7,2 km"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Czas</label><input id="f-time" value="${App.escapeHtml(item.time)}" placeholder="np. 2h 30min"></div>
        <div class="form-group"><label>Trudność</label><select id="f-diff">
          <option value="łatwy" ${item.difficulty==='łatwy'?'selected':''}>Łatwy</option>
          <option value="średni" ${item.difficulty==='średni'?'selected':''}>Średni</option>
          <option value="trudny" ${item.difficulty==='trudny'?'selected':''}>Trudny</option>
        </select></div>
      </div>
      <div class="form-group"><label>Punkty trasy (x,y x,y x,y...)</label><textarea id="f-points" rows="3" style="font-family:monospace">${App.escapeHtml(item.points)}</textarea><small class="help">Format: pary współrzędnych X,Y (0–100) oddzielone spacjami</small></div>
    `;
    const m = Admin.modal({
      title: isNew ? "Nowy szlak" : "Edytuj szlak",
      body: form,
      footer: `<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="save">Zapisz</button>`
    });
    m.root.querySelector("#save").addEventListener("click", () => {
      const data = {
        name: form.querySelector("#f-name").value.trim(),
        color: form.querySelector("#f-color").value,
        length: form.querySelector("#f-length").value,
        time: form.querySelector("#f-time").value,
        difficulty: form.querySelector("#f-diff").value,
        points: form.querySelector("#f-points").value.trim()
      };
      if (!data.name) return App.toast("Nazwa wymagana","err");
      if (isNew) Store.add("trails", data); else Store.update("trails", id, data);
      App.toast(isNew?"Dodano!":"Zapisano!","ok"); m.close(); renderTrails();
    });
  }

  document.getElementById("btnNewPoi").addEventListener("click", () => openPoi(null));
  document.getElementById("btnNewTrail").addEventListener("click", () => openTrail(null));
  renderPoi(); renderTrails();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Partnerzy — Panel admina</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="admin-sidebar-slot"></div>
<div class="admin-main">
  <div id="admin-topbar-slot"></div>
  <div class="admin-content">

    <div class="admin-card">
      <div class="admin-card-head">
        <h3>🤝 Partnerzy (<span id="count">0</span>)</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" id="bulkPublish" disabled>📢 Aktualizuj kategorię</button>
          <button class="btn btn-danger btn-sm" id="bulkDelete" disabled>🗑 Usuń zaznaczone</button>
          <button class="btn btn-primary" id="btnNew">+ Nowy partner</button>
        </div>
      </div>
      <div class="admin-card-body" style="padding-bottom:0">
        <div class="page-filters">
          <input type="search" id="search" placeholder="Szukaj partnera...">
          <select id="f-tier"><option value="">Wszystkie poziomy</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option></select>
          <select id="f-cat"><option value="">Wszystkie kategorie</option></select>
        </div>
      </div>
      <table class="admin-table" id="ptable">
        <thead><tr><th></th><th>Partner</th><th>Kategoria</th><th>Poziom</th><th>Od roku</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- Bulk actions bar -->
    <div class="bulk-actions-bar" id="bulkBar">
      <div class="selection-count">Zaznaczono: <strong id="selCount">0</strong></div>
      <div class="actions">
        <button class="btn btn-outline btn-sm" id="bulkClear" style="border-color:rgba(255,255,255,.3);color:#fff">Anuluj zaznaczenie</button>
        <button class="btn btn-danger btn-sm" id="bulkDelete2">🗑 Usuń zaznaczone</button>
      </div>
    </div>

  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
if (Admin.init({ title: "Partnerzy" })) {
  let state = { search: "", tier: "", cat: "" };
  let bulk;

  const tierLabels = { platinum: "Platinum ⭐", gold: "Gold 🥇", silver: "Silver 🥈", bronze: "Bronze 🥉" };

  function categories() { return [...new Set(Store.all("partners").map(p => p.category))]; }

  function render() {
    const cats = categories();
    const sel = document.getElementById("f-cat");
    if (sel.options.length === 1) cats.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); });

    let list = Store.all("partners");
    if (state.search) list = list.filter(p => p.name.toLowerCase().includes(state.search) || (p.description||"").toLowerCase().includes(state.search));
    if (state.tier) list = list.filter(p => p.tier === state.tier);
    if (state.cat) list = list.filter(p => p.category === state.cat);

    document.getElementById("count").textContent = list.length;
    const tbody = document.getElementById("tbody");
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted)">Brak partnerów</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(p => `
      <tr data-id="${p.id}">
        <td><div class="thumb" style="background: linear-gradient(135deg, ${(p.logo?.colors||['#888','#444']).join(',')})"></div></td>
        <td><strong>${App.escapeHtml(p.name)}</strong><br><small style="color:var(--text-muted)">${App.escapeHtml((p.description||"").slice(0, 60))}...</small></td>
        <td><span class="badge">${App.escapeHtml(p.category)}</span></td>
        <td><span class="tier-badge ${p.tier}">${tierLabels[p.tier] || p.tier}</span></td>
        <td>${p.since || '—'}</td>
        <td><div class="row-actions">
          ${p.website && p.website !== '#' ? `<a class="row-action-btn" href="${App.escapeHtml(p.website)}" target="_blank" title="Strona"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>` : ''}
          <button class="row-action-btn" data-edit="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="row-action-btn delete" data-del="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div></td>
      </tr>
    `).join("");

    tbody.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openForm(b.dataset.edit)));
    tbody.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (await Admin.confirmDialog("Usunąć partnera?")) {
        const p = Store.get("partners", b.dataset.del);
        Store.remove("partners", b.dataset.del);
        Admin.logActivity("delete", "partners", p?.name || b.dataset.del);
        App.toast("Usunięto","ok"); render();
      }
    }));

    // Setup bulk select
    bulk = Admin.bulkSelect(document.getElementById("ptable"), (selected) => {
      const bar = document.getElementById("bulkBar");
      document.getElementById("selCount").textContent = selected.length;
      bar.classList.toggle("show", selected.length > 0);
      document.getElementById("bulkDelete").disabled = selected.length === 0;
    });
  }

  function openForm(id) {
    const isNew = !id;
    const item = isNew ? { name:"", tier:"silver", category:"Lokalni", description:"", website:"", since: new Date().getFullYear(), logo: { kind:"circle", colors:["#8B5A2B","#1F1F1F"] } } : Store.get("partners", id);
    if (!item) return;

    const form = document.createElement("div");
    form.innerHTML = `
      <div class="form-group"><label>Nazwa *</label><input id="f-name" value="${App.escapeHtml(item.name)}" required></div>
      <div class="form-row">
        <div class="form-group"><label>Kategoria</label><input id="f-cat" value="${App.escapeHtml(item.category)}" list="cats" placeholder="np. Instytucje"><datalist id="cats">${[...new Set(Store.all("partners").map(p=>p.category))].map(c=>`<option>${c}</option>`).join("")}</datalist></div>
        <div class="form-group"><label>Poziom</label><select id="f-tier">
          <option value="platinum" ${item.tier==='platinum'?'selected':''}>Platinum ⭐</option>
          <option value="gold" ${item.tier==='gold'?'selected':''}>Gold 🥇</option>
          <option value="silver" ${item.tier==='silver'?'selected':''}>Silver 🥈</option>
          <option value="bronze" ${item.tier==='bronze'?'selected':''}>Bronze 🥉</option>
        </select></div>
      </div>
      <div class="form-group"><label>Opis</label><textarea id="f-desc" rows="3">${App.escapeHtml(item.description)}</textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Strona WWW</label><input id="f-web" value="${App.escapeHtml(item.website||'')}" placeholder="https://..."></div>
        <div class="form-group"><label>Współpraca od (rok)</label><input type="number" id="f-since" value="${item.since||new Date().getFullYear()}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Kształt logo</label><select id="f-kind">
          ${["circle","shield","key","leaf","tree","drop","stars","wave","rect"].map(k => `<option value="${k}" ${item.logo?.kind===k?'selected':''}>${k}</option>`).join("")}
        </select></div>
        <div class="form-group"><label>Kolory logo (2)</label>
          <div style="display:flex;gap:6px">
            <input type="color" id="f-c1" value="${item.logo?.colors?.[0] || '#8B5A2B'}" style="flex:1">
            <input type="color" id="f-c2" value="${item.logo?.colors?.[1] || '#1F1F1F'}" style="flex:1">
          </div>
        </div>
      </div>
      <div id="logo-preview" style="text-align:center;margin: 16px 0;padding: 16px;background:var(--sand-50);border-radius:var(--r-md)"></div>
    `;

    function refreshPreview() {
      const preview = {
        name: form.querySelector("#f-name").value || "AB",
        logo: {
          kind: form.querySelector("#f-kind").value,
          colors: [form.querySelector("#f-c1").value, form.querySelector("#f-c2").value]
        }
      };
      form.querySelector("#logo-preview").innerHTML = `<div style="width:120px;height:120px;margin:0 auto">${App.partnerLogoSVG(preview)}</div>`;
    }
    form.querySelectorAll("input, select").forEach(el => el.addEventListener("input", refreshPreview));
    refreshPreview();

    const m = Admin.modal({
      title: isNew ? "Nowy partner" : "Edytuj partnera",
      body: form,
      footer: `<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="save">Zapisz</button>`
    });
    m.root.querySelector("#save").addEventListener("click", () => {
      const name = form.querySelector("#f-name").value.trim();
      if (!name) return App.toast("Nazwa wymagana","err");
      const data = {
        name,
        category: form.querySelector("#f-cat").value.trim() || "Inne",
        tier: form.querySelector("#f-tier").value,
        description: form.querySelector("#f-desc").value,
        website: form.querySelector("#f-web").value || "#",
        since: parseInt(form.querySelector("#f-since").value) || new Date().getFullYear(),
        logo: {
          kind: form.querySelector("#f-kind").value,
          colors: [form.querySelector("#f-c1").value, form.querySelector("#f-c2").value]
        }
      };
      if (isNew) { Store.add("partners", data); Admin.logActivity("create", "partners", data.name); }
      else { Store.update("partners", id, data); Admin.logActivity("update", "partners", data.name); }
      App.toast(isNew?"Dodano!":"Zapisano!","ok");
      m.close(); render();
    });
  }

  document.getElementById("btnNew").addEventListener("click", () => openForm(null));
  document.getElementById("search").addEventListener("input", e => { state.search = e.target.value.toLowerCase(); render(); });
  document.getElementById("f-tier").addEventListener("change", e => { state.tier = e.target.value; render(); });
  document.getElementById("f-cat").addEventListener("change", e => { state.cat = e.target.value; render(); });

  // Bulk delete actions
  function doBulkDelete() {
    const ids = bulk?.selected() || [];
    if (!ids.length) return;
    Admin.confirmDialog(`Usunąć ${ids.length} partnerów?`).then(yes => {
      if (!yes) return;
      ids.forEach(id => Store.remove("partners", id));
      Admin.logActivity("delete", "partners", `Usunięto ${ids.length} partnerów (bulk)`);
      App.toast(`Usunięto ${ids.length} partnerów`, "ok");
      bulk?.reset();
      render();
    });
  }
  document.getElementById("bulkDelete").addEventListener("click", doBulkDelete);
  document.getElementById("bulkDelete2").addEventListener("click", doBulkDelete);
  document.getElementById("bulkClear").addEventListener("click", () => bulk?.reset());

  const editId = new URLSearchParams(location.search).get("edit");
  render();
  if (editId) openForm(editId);
}
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="currentColor" aria-label="Pustynia Błędowska">
  <!-- Hexagon outline -->
  <polygon points="100,8 180,52 180,148 100,192 20,148 20,52" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
  <!-- 8-point compass star -->
  <g>
    <!-- Vertical points -->
    <polygon points="100,20 110,95 100,100 90,95"/>
    <polygon points="100,180 110,105 100,100 90,105"/>
    <!-- Horizontal points -->
    <polygon points="22,100 95,90 100,100 95,110"/>
    <polygon points="178,100 105,90 100,100 105,110"/>
    <!-- Diagonal points -->
    <polygon points="42,42 95,95 100,100 95,95" transform="translate(0,0)"/>
    <polygon points="158,42 105,95 100,100 105,95"/>
    <polygon points="42,158 95,105 100,100 95,105"/>
    <polygon points="158,158 105,105 100,100 105,105"/>
    <!-- Star body diamonds -->
    <polygon points="100,30 110,95 100,100 90,95" opacity="1"/>
    <polygon points="100,170 110,105 100,100 90,105" opacity="1"/>
    <polygon points="30,100 95,90 100,100 95,110" opacity="1"/>
    <polygon points="170,100 105,90 100,100 105,110" opacity="1"/>
    <polygon points="50,50 95,95 100,100 90,90" opacity=".95"/>
    <polygon points="150,50 105,95 100,100 110,90" opacity=".95"/>
    <polygon points="50,150 95,105 100,100 90,110" opacity=".95"/>
    <polygon points="150,150 105,105 100,100 110,110" opacity=".95"/>
  </g>
</svg>
